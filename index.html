<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Seoul Autumn 2026</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Seoul 2026"><meta name="theme-color" content="#6B2232"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* Layout: editorial trip journal — sticky day rail, timeline cards, bottom nav on phones, top nav on desktop */
:root{
  --ivory:#F7F4EF; --burgundy:#722F37; --brown:#795548; --forest:#475746; --charcoal:#252525; --gold:#C7A56B;
  --bg:#F7F4EF; --surface:#FFFDF9; --sunk:#EFEAE2; --fg:#252525; --muted:#6B625A; --line:#DDD5C9;
  --accent:#722F37; --accent-fg:#FFFDF9; --leaf:#475746; --bark:#795548; --gilt:#9A7A3E; --gilt-soft:#F1E6CF;
  --warn-bg:#F6E7D3; --warn-fg:#6E4317; --ok:#3F6B45;
  --f-body:"IBM Plex Sans Thai","DM Sans",system-ui,sans-serif;
  --f-latin:"DM Sans","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-han:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1817; --surface:#24201E; --sunk:#2D2826; --fg:#F1ECE4; --muted:#B3A99D; --line:#3D3633;
  --accent:#C9727C; --accent-fg:#1B1817; --leaf:#93A891; --bark:#C49A86; --gilt:#D8B97F; --gilt-soft:#3A3122;
  --warn-bg:#3B2C1C; --warn-fg:#EBC593; --ok:#8FBF95; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1817; --surface:#24201E; --sunk:#2D2826; --fg:#F1ECE4; --muted:#B3A99D; --line:#3D3633;
  --accent:#C9727C; --accent-fg:#1B1817; --leaf:#93A891; --bark:#C49A86; --gilt:#D8B97F; --gilt-soft:#3A3122;
  --warn-bg:#3B2C1C; --warn-fg:#EBC593; --ok:#8FBF95; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 32px)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.han{font-family:var(--f-han)}
.latin{font-family:var(--f-latin)}
.eyebrow{font:600 11.5px/1 var(--f-latin);letter-spacing:.14em;text-transform:uppercase;color:var(--gilt)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-family:var(--f-latin);white-space:nowrap}
.brand .han{color:var(--accent);font-size:18px}
.tabs-desk{display:none;gap:4px;margin-left:auto}
.tabs-desk button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs-desk button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom-nav button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:var(--nav-h)}
.bottom-nav svg{width:22px;height:22px}
.bottom-nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
@media (min-width:860px){.tabs-desk{display:flex}.bottom-nav{display:none}.wrap{padding-block:0 56px}}

section.view{padding-top:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.sec-head h2{font-size:24px}

/* hero */
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--charcoal);color:#F7F4EF;padding:28px 22px 24px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.95}
.hero .han-big{font-family:var(--f-han);font-weight:900;font-size:clamp(46px,12vw,96px);line-height:1;letter-spacing:-.02em;color:#F7F4EF}
.hero .han-big span{color:var(--gold)}
.hero p{max-width:52ch;margin:10px 0 0;color:#E8E1D6}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-family:var(--f-latin);font-size:13.5px;color:#E8E1D6}
.hero .meta b{color:#fff}
.countdown{display:inline-flex;align-items:baseline;gap:6px;margin-top:16px;background:rgba(247,244,239,.12);border:1px solid rgba(199,165,107,.5);padding:6px 12px;border-radius:999px;font-size:13.5px}
.countdown b{font:700 20px var(--f-latin);color:var(--gold)}

.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1.25fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:17px;margin-bottom:10px}

.day-list{display:grid;gap:0}
.day-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.day-row:first-child{border-top:0}
.dno{font:700 12px var(--f-latin);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.dno b{display:block;font-size:22px;letter-spacing:0;color:var(--fg)}
.day-row .t{font-weight:600}
.day-row .s{font-size:13px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.p-fixed{background:var(--accent);color:var(--accent-fg)}
.p-walk{background:#EEF3EC;color:#3E5B3A;border:1px solid #B9CDB4}
.p-must{background:var(--gilt-soft);color:var(--gilt);border:1px solid var(--gilt)}
.p-proposed{background:var(--warn-bg);color:var(--warn-fg)}
.p-tbc{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.p-est{background:var(--sunk);color:var(--muted)}
.p-planned{background:transparent;color:var(--leaf);border:1px solid var(--leaf)}

.adgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.adday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 0 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.adday>*:not(.adimg){margin-inline:14px}
.adimg{border:0;padding:0;display:block;aspect-ratio:16/9;max-width:100%;overflow:hidden;cursor:pointer;background:var(--sunk)}
.adimg img{width:100%;height:100%;object-fit:cover;display:block}
.adhead{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding-top:12px}
.adhead .t{font-weight:600;line-height:1.3}.adhead .s{font-size:12.5px;color:var(--muted)}
.adlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.adlist li{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;align-items:baseline}
.adlist .at{font:600 12.5px var(--f-latin);color:var(--muted)}
.adlist .an{background:none;border:0;padding:3px 0;text-align:left;cursor:pointer;color:var(--fg);line-height:1.35}
.adlist .an:hover{color:var(--accent)}
.adlist li.mn .an{color:var(--muted);font-size:13px}
.adlist li.dn .an{text-decoration:line-through;color:var(--muted)}
.adlist .pill{padding:2px 6px;font-size:10.5px;vertical-align:1px}
.note{background:var(--warn-bg);color:var(--warn-fg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.note b{display:block;margin-bottom:2px}
.info{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:14px}

/* weather */
.wx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.wx div{background:var(--sunk);border-radius:8px;padding:10px 6px;text-align:center;font-size:12px;min-width:0}
.wx b{display:block;font:700 15px var(--f-latin)}
.wx span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.clim{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.clim li{display:flex;gap:10px;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:6px}
.clim li span:last-child{text-align:right;font-weight:600}

/* day selector */
.daybar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--bg);padding:10px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybar button{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:center;line-height:1.2}
.daybar button small{display:block;font:600 10.5px var(--f-latin);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.daybar button b{font:700 17px var(--f-latin)}
.daybar button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.daybar button[aria-selected="true"] small{color:var(--accent-fg);opacity:.85}

.dayhead{display:grid;gap:6px;margin:6px 0 14px}
.dayhead h2{font-size:clamp(22px,4.5vw,30px)}
.dayhead .theme-ko{font-family:var(--f-han);color:var(--bark);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--fg);min-height:38px}
.btn:hover{border-color:var(--gilt)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#F7F4EF}
:root[data-theme="dark"] .btn.primary{background:var(--leaf);border-color:var(--leaf);color:#1B1817}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{background:var(--leaf);border-color:var(--leaf);color:#1B1817}}
.btn.naver{background:#03C75A;border-color:#03C75A;color:#fff;font-weight:600}
.btn svg{width:16px;height:16px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:1px;background:var(--line)}
.stop{display:grid;grid-template-columns:50px 1fr;gap:17px;padding:6px 0;position:relative}
.stop .time{font:600 13px var(--f-latin);text-align:right;padding-top:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.stop .time small{display:block;font-weight:400;font-size:11.5px}
.stop::after{content:"";position:absolute;left:54px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.stop.is-must::after{background:var(--gilt);border-color:var(--gilt)}
.stop.is-fixed::after{background:var(--accent);border-color:var(--accent)}
.stop.is-done .card{opacity:.6}
.stop.is-done::after{background:var(--ok);border-color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stop.is-must .card{border-color:color-mix(in srgb,var(--gilt) 55%,var(--line))}
.stop.is-fixed .card{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.stop.is-minor .card{background:transparent;border-style:dashed}
.card-h{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.card-h .txt{flex:1;min-width:0}
.card-h .en{font-weight:600;font-family:var(--f-latin);font-size:15.5px}
.card-h .ko{font-family:var(--f-han);font-size:13.5px;color:var(--bark)}
.card-h .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.card.now{outline:2px solid var(--accent);outline-offset:2px}.card.now .card-h::before{content:"ตอนนี้";font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;margin-right:6px;align-self:flex-start}.igd{margin:10px 0}.igd-s{margin:6px 0 0}.igd-s summary{padding:6px 10px;font-size:13px;display:inline-block}.igd summary{cursor:pointer;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);list-style:none}.igd summary::-webkit-details-marker{display:none}@media (max-width:600px){.eatrow .btn{padding:7px 10px;font-size:13px}.eatrow .btn svg{width:15px;height:15px}.eat .meta{font-size:12px}.mealbox{padding:8px 10px}.igwall{grid-template-columns:1fr}}.mealbox summary{cursor:pointer;list-style:revert}.eatrow{display:flex;gap:10px;align-items:center;justify-content:space-between}.eatrow .btn{flex:none}.en-name{font-size:13px;font-weight:600;color:var(--ink,inherit);opacity:.8}.ic{font-size:15px;letter-spacing:1px}.mealbox{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}.mealbox select{width:100%;font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:inherit;margin-top:6px}.mealpick{margin-top:8px;font-size:14px}.eat{padding:11px 0;border-bottom:1px solid var(--line)}.eat b{font-size:15px}.eat .meta{font-size:12.5px;color:var(--muted);margin-top:2px}.eat a{font-size:13px;margin-right:10px}.eatgrp{margin:22px 0 4px;font-size:16px}.igwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.hthumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-14px;padding-inline:14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 78%;max-width:340px;aspect-ratio:4/3;border:0;padding:0;border-radius:8px;overflow:hidden;scroll-snap-align:start;cursor:pointer;background:var(--sunk)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.chev{width:18px;height:18px;flex:none;margin-top:3px;transition:transform .2s;color:var(--muted)}
.card[data-open="true"] .chev{transform:rotate(180deg)}
.card-b{padding:0 14px 14px;display:grid;gap:12px}
.card-b p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;min-height:38px;background:var(--surface)}
.chk[aria-pressed="true"]{background:var(--sunk);border-color:var(--gilt)}
.chk svg{width:16px;height:16px}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;resize:vertical}
.daynotes{margin-top:18px;display:grid;gap:10px}
.photo-hint{font-size:13px;color:var(--muted)}

/* gallery */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px}
.fchip[aria-pressed="true"]{background:var(--charcoal);border-color:var(--charcoal);color:#F7F4EF}
:root[data-theme="dark"] .fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}}
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.tile{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.cover{position:relative;aspect-ratio:4/3;max-width:100%;cursor:pointer;border:0;padding:0;width:100%;display:block;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;text-align:left;color:#F7F4EF}
.cover .ph .k{font-family:var(--f-han);font-weight:900;font-size:30px;line-height:1.1;opacity:.95}
.cover .ph .lab{font:600 10.5px var(--f-latin);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:auto}
.cover .count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font:600 11px var(--f-latin);padding:3px 8px;border-radius:999px}
.tile-b{padding:12px 14px;display:grid;gap:8px;flex:1}
.tile-b .en{font-weight:600;font-family:var(--f-latin)}
.tile-b code{font-family:var(--f-han);font-size:12.5px;background:var(--sunk);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a,.links button,.links label{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--fg);background:var(--bg);cursor:pointer;min-height:32px;display:inline-flex;align-items:center}
.links a:hover{border-color:var(--gilt)}
input[type=file]{display:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(15,12,11,.94);color:#F7F4EF;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-top b{font-family:var(--f-latin)}
.lb-x{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;width:42px;height:42px;font-size:22px;cursor:pointer}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:12px 0;touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-card{max-width:560px;text-align:center}
.lb-card .k{font-family:var(--f-han);font-weight:900;font-size:clamp(40px,10vw,72px);line-height:1.1;color:var(--gold)}
.lb-card p{color:#D9D2C6}
.lb-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-nav button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;min-height:42px}
.lb .links a{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.lb-credit{font-size:12.5px;color:#BDB4A7;text-align:center;margin-top:6px}

/* shopping */
.shop-top{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.shop-top{grid-template-columns:1fr 320px}}
.budget{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.budget .n{font:700 22px var(--f-latin);font-variant-numeric:tabular-nums}
.budget label{font-size:12.5px;color:var(--muted)}
.field{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;min-height:40px}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.searchrow .field{flex:1 1 200px;width:auto}
.items{display:grid;gap:10px}
.shopgroup h3{font-size:16px;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start}
.item.bought{opacity:.62}

/* falling ginkgo leaves on the hero (canvas, static if reduced motion) */
let leafRAF;
function drawLeaves(){
  const c=document.getElementById("leafCanvas");if(!c)return;cancelAnimationFrame(leafRAF);
  const ctx=c.getContext("2d");const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const cols=["#C7A56B","#D9A93C","#B98A2E","#8C3A3F","#A45A3B"];
  const leaves=Array.from({length:Math.round(W/22)},()=>({x:rnd(0,W),y:rnd(-H,H),s:rnd(7,16),r:rnd(0,6.28),vr:rnd(-.02,.02),vy:rnd(.25,.7),sw:rnd(0,6.28),c:cols[Math.floor(rnd(0,cols.length))]}));
  function leaf(l){ctx.save();ctx.translate(l.x+Math.sin(l.sw)*8,l.y);ctx.rotate(l.r);ctx.fillStyle=l.c;ctx.globalAlpha=.75;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,l.s,-Math.PI*.85,-Math.PI*.15);ctx.closePath();ctx.fill();
    ctx.globalAlpha=.5;ctx.strokeStyle=l.c;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,l.s*.5);ctx.stroke();ctx.restore()}
  function bg(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#2A1E1C");g.addColorStop(.6,"#3B2422");g.addColorStop(1,"#4A3A28");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(){bg();for(const l of leaves){if(!reduce){l.y+=l.vy;l.r+=l.vr;l.sw+=.01;if(l.y>H+20){l.y=-20;l.x=rnd(0,W)}}leaf(l)}if(!reduce&&!document.getElementById("v-overview").hidden)leafRAF=requestAnimationFrame(frame)}
  frame();
}

  lb.innerHTML=`<div class="lb-top"><div><b>${esc(s.en)}</b><div class="han" style="color:var(--gold)">${esc(s.ko)}</div></div><button class="lb-x" id="lbx" aria-label="ปิด">×</button></div>

  ${p?(p.mine!=null
    ?`<div class="lb-credit">รูปที่เพิ่มเอง · ${esc(p.name)} · ${lbPhoto+1}/${mine.length} <button class="btn" style="margin-left:8px;min-height:30px;padding:3px 10px;background:transparent;color:#fff" id="lbdel">ลบรูปนี้</button></div>`
    :`<div class="lb-credit"><span style="color:#F7F4EF">${esc(p.alt)}</span><br>ภาพ: ${esc(p.by)}${p.link?` · ${esc(p.lic)} · <a href="${p.link}" target="_blank" rel="noopener" style="color:var(--gold)">ต้นฉบับบน Wikimedia Commons</a>`:""} · ${lbPhoto+1}/${mine.length}</div>
      <div class="links" style="justify-content:center;margin-top:8px"><a href="${naverImg(s.photo)}" target="_blank" rel="noopener">รูปเพิ่มบน Naver</a><a href="${igTag(s.tag)}" target="_blank" rel="noopener">#${esc(s.tag)}</a></div>`):""}
  <div class="lb-nav"><button id="lbp">‹ ก่อนหน้า</button><span class="tnum" style="font-size:13px;color:#BDB4A7">${lbIdx+1} / ${PHOTO.length}</span><button id="lbn">ถัดไป ›</button></div>`;
  lb.querySelector("#lbx").onclick=closeLB;
  lb.querySelector("#lbp").onclick=()=>step(-1);lb.querySelector("#lbn").onclick=()=>step(1);
  const del=lb.querySelector("#lbdel");if(del)del.onclick=()=>{const own=load("ph:"+s.id,[])||[];own.splice(p.mine,1);save("ph:"+s.id,own);lbPhoto=Math.max(0,lbPhoto-1);drawLB();rerender()};
  let sx=null;const st=lb.querySelector("#lbstage");
  st.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
  st.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)step(dx<0?1:-1);sx=null});
}
function step(dir){const s=PHOTO[lbIdx];const n=picsOf(s.id).length;
  if(n&&lbPhoto+dir>=0&&lbPhoto+dir<n){lbPhoto+=dir}else{lbIdx=(lbIdx+dir+PHOTO.length)%PHOTO.length;const m=picsOf(PHOTO[lbIdx].id).length;lbPhoto=dir<0&&m?m-1:0}drawLB()}

  </form>`;
  el.querySelector("#rate").addEventListener("change",e=>{const v=parseFloat(e.target.value);rate=v>0?v:"";save("rate",rate);renderShopping()});
  el.querySelector("#shopSearch").addEventListener("input",e=>{q=e.target.value;const pos=e.target.selectionStart;renderShopping();const s=document.getElementById("shopSearch");s.focus();s.setSelectionRange(pos,pos)});
  el.querySelector("#priSel").addEventListener("change",e=>{priF=e.target.value;renderShopping()});
  el.querySelector("#addForm").addEventListener("submit",e=>{e.preventDefault();const n=el.querySelector("#addName").value.trim();if(!n)return;
    const ko=el.querySelector("#addKo").value.trim();const shop=el.querySelector("#addShop").value;
    items.push({id:"c"+Date.now(),shop,name:n,ko,pri:el.querySelector("#addPri").value,qty:1,price:"",bought:false,note:"",link:shop==="oy"?oy(ko||n):nv(ko||n)});saveItems();toast("เพิ่ม "+n+" แล้ว");renderShopping()});
  el.querySelector("#exportShop").onclick=()=>{
    const txt="Seoul Autumn 2026 · Shopping list\n"+Object.keys(SHOPS).map(k=>{const g=items.filter(i=>i.shop===k);return g.length?`\n${SHOPS[k].l}\n`+g.map(i=>`${i.bought?"[x]":"[ ]"} ${i.name}${i.ko?" ("+i.ko+")":""} ×${i.qty}${i.pri==="must"?" · Must":""}${i.price?" · "+krw(i.price):""}${i.note?" · "+i.note:""}`).join("\n"):""}).join("")+`\n\nรวม ${krw(t.all)}`;
    copyText(txt,"คัดลอกรายการช้อปปิ้งแล้ว",el.querySelector("#shopCopyHost"))};
}
function itemHTML(it){return `<div class="item${it.bought?" bought":""}">
  <input type="checkbox" class="bigchk" id="b-${it.id}" data-buy="${it.id}" ${it.bought?"checked":""} aria-label="ซื้อแล้ว">
  <div style="min-width:0"><label for="b-${it.id}" class="iname">${esc(it.name)}</label>${it.ko?`<div class="isub han">${esc(it.ko)}</div>`:""}
    <div class="links" style="margin-top:6px">${it.link?`<a href="${it.link}" target="_blank" rel="noopener">ดูสินค้า/รูป</a>`:""}${it.ko?`<button data-copyko="${esc(it.ko)}">คัดลอกชื่อเกาหลี</button>`:""}</div></div>
  <div class="irow">
    <select data-pri="${it.id}" aria-label="ความสำคัญ"><option value="must"${it.pri==="must"?" selected":""}>Must Buy</option><option value="maybe"${it.pri==="maybe"?" selected":""}>Maybe</option></select>
    <input class="qty" type="number" min="1" value="${esc(it.qty)}" data-qty="${it.id}" aria-label="จำนวน">
    <input class="price tnum" inputmode="numeric" placeholder="ราคา ₩" value="${esc(it.price)}" data-price="${it.id}" aria-label="ราคาวอนต่อชิ้น">
    <input class="inote" placeholder="โน้ต เช่น เบอร์สี" value="${esc(it.note)}" data-inote="${it.id}" aria-label="โน้ต">
    <button class="xbtn" data-del="${it.id}">ลบ</button>
  </div></div>`}
const findIt=id=>items.find(i=>i.id===id);
document.addEventListener("change",e=>{
  const b=e.target.closest("[data-buy]");if(b){findIt(b.dataset.buy).bought=b.checked;saveItems();renderShopping();return}
  const p=e.target.closest("[data-pri]");if(p){findIt(p.dataset.pri).pri=p.value;saveItems();return}
  const qn=e.target.closest("[data-qty]");if(qn){findIt(qn.dataset.qty).qty=Math.max(1,parseInt(qn.value)||1);saveItems();renderShopping();return}
  const pr=e.target.closest("[data-price]");if(pr){findIt(pr.dataset.price).price=pr.value.replace(/[^\d]/g,"");saveItems();renderShopping();return}
  const n=e.target.closest("[data-inote]");if(n){findIt(n.dataset.inote).note=n.value;saveItems();return}
});
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-del]");if(d){items=items.filter(i=>i.id!==d.dataset.del);saveItems();toast("ลบแล้ว");renderShopping();return}
  const sf=e.target.closest("[data-sf]");if(sf){shopF=sf.dataset.sf;save("shopf",shopF);renderShopping()}
});
